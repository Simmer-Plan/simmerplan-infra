---
# Terraform Apply (SIM-34). Push to development auto-applies sandbox; push to
# main applies prod behind the manual approval gate on the "prod" GitHub
# environment (Settings -> Environments -> prod -> Required reviewers).
#
# Authentication is OIDC only. Required repository variables: see
# terraform_plan.yml.

name: Terraform Apply

on:
  push:
    branches: [main, development]
    paths:
      - 'terraform/**'

permissions:
  id-token: write
  contents: read

# Queue applies instead of cancelling — an interrupted apply is worse than a
# stale one.
concurrency:
  group: terraform-apply-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: ca-central-1
  TF_IN_AUTOMATION: "true"
  TF_ENV: ${{ github.ref_name == 'main' && 'prod' || 'sandbox' }}
  TF_ACCOUNT_ID: ${{ github.ref_name == 'main' && vars.PROD_ACCOUNT_ID || vars.SANDBOX_ACCOUNT_ID }}

jobs:
  apply:
    name: Apply (${{ github.ref_name == 'main' && 'prod' || 'sandbox' }})
    runs-on: ubuntu-latest
    # The prod environment carries the required-reviewers protection rule,
    # which is what makes the prod apply gate manual.
    environment: ${{ github.ref_name == 'main' && 'prod' || 'sandbox' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.15.0"

      - name: Terraform init
        working-directory: terraform/accounts/${{ env.TF_ENV }}
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="use_lockfile=true"

      - name: Terraform apply
        working-directory: terraform/accounts/${{ env.TF_ENV }}
        run: |
          terraform apply -input=false -auto-approve \
            -var="account_id=${TF_ACCOUNT_ID}"

      - name: Show outputs
        working-directory: terraform/accounts/${{ env.TF_ENV }}
        run: terraform output -no-color
