---
# Ansible Deploy (SIM-34). Runs on ansible/ changes, and after every
# successful Terraform Apply so fresh infrastructure immediately receives a
# deploy + health check. OIDC authentication throughout.

name: Ansible Deploy

on:
  push:
    branches: [main, development]
    paths:
      - 'ansible/**'
  workflow_run:
    workflows: ["Terraform Apply"]
    types: [completed]

permissions:
  id-token: write
  contents: read

concurrency:
  group: ansible-deploy-${{ github.event.workflow_run.head_branch || github.ref_name }}
  cancel-in-progress: false

env:
  AWS_REGION: ca-central-1

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    # For workflow_run triggers, only proceed when the apply succeeded on a
    # deployable branch.
    if: >-
      github.event_name == 'push' ||
      (github.event.workflow_run.conclusion == 'success' &&
       contains(fromJSON('["main", "development"]'), github.event.workflow_run.head_branch))

    steps:
      - name: Resolve target environment
        run: |
          BRANCH="${{ github.event.workflow_run.head_branch || github.ref_name }}"
          if [ "$BRANCH" = "main" ]; then
            echo "DEPLOY_ENV=prod" >> "$GITHUB_ENV"
          else
            echo "DEPLOY_ENV=sandbox" >> "$GITHUB_ENV"
          fi
          echo "Deploying to: $BRANCH"

      - name: Checkout infra
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_branch || github.ref_name }}

      - name: Checkout app (deploy artifacts source)
        uses: actions/checkout@v4
        with:
          repository: Simmer-Plan/simmerplan-app
          path: simmerplan-app

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ansible
        run: pip install ansible

      # Node + pnpm are needed by deploy_lambda.yml, which builds the app's
      # esbuild bundles from the checked-out simmerplan-app before pushing them.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: simmerplan-app/pnpm-lock.yaml

      - name: Deploy Lambda functions
        working-directory: ansible
        run: >-
          ansible-playbook playbooks/deploy_lambda.yml
          -e env=${{ env.DEPLOY_ENV }}
          -e app_repo_path=${{ github.workspace }}/simmerplan-app

      - name: Deploy static assets
        working-directory: ansible
        run: >-
          ansible-playbook playbooks/deploy_static.yml
          -e env=${{ env.DEPLOY_ENV }}
          -e app_repo_path=${{ github.workspace }}/simmerplan-app

      - name: Health check
        working-directory: ansible
        run: >-
          ansible-playbook playbooks/health_check.yml
          -e env=${{ env.DEPLOY_ENV }}
