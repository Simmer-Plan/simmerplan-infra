---
# Ansible Deploy (SIM-34). Runs on ansible/ changes, and after every
# successful Terraform Apply so fresh infrastructure immediately receives a
# deploy + health check. OIDC authentication throughout.

name: Ansible Deploy

on:
  push:
    branches: [main, development]
    paths:
      - 'ansible/**'
  workflow_run:
    workflows: ["Terraform Apply"]
    types: [completed]
  # Manual trigger: the push filter above only fires on ansible/** changes, so a
  # workflow-only or app-side change otherwise has no way to redeploy.
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: ansible-deploy-${{ github.event.workflow_run.head_branch || github.ref_name }}
  cancel-in-progress: false

env:
  AWS_REGION: ca-central-1

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    # For workflow_run triggers, only proceed when the apply succeeded on a
    # deployable branch.
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       contains(fromJSON('["main", "development"]'), github.event.workflow_run.head_branch))

    steps:
      - name: Resolve target environment
        run: |
          BRANCH="${{ github.event.workflow_run.head_branch || github.ref_name }}"
          if [ "$BRANCH" = "main" ]; then
            echo "DEPLOY_ENV=prod" >> "$GITHUB_ENV"
            echo "APP_REF=main" >> "$GITHUB_ENV"
            echo "TARGET_ACCOUNT_ID=${{ vars.PROD_ACCOUNT_ID }}" >> "$GITHUB_ENV"
          else
            echo "DEPLOY_ENV=sandbox" >> "$GITHUB_ENV"
            echo "APP_REF=development" >> "$GITHUB_ENV"
            echo "TARGET_ACCOUNT_ID=${{ vars.SANDBOX_ACCOUNT_ID }}" >> "$GITHUB_ENV"
          fi
          echo "Deploying to: $BRANCH"

      - name: Checkout infra
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_branch || github.ref_name }}

      # Without an explicit ref this checks out the app repo's DEFAULT branch
      # (main), not the branch matching the environment being deployed — which
      # silently ships stale code. Track the deploy target: sandbox -> the app's
      # development branch, prod -> main.
      - name: Checkout app (deploy artifacts source)
        uses: actions/checkout@v4
        with:
          repository: Simmer-Plan/simmerplan-app
          ref: ${{ env.APP_REF }}
          path: simmerplan-app

      - name: Configure AWS credentials (OIDC -> management)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # The OIDC role lives in the MANAGEMENT account, but the resources being
      # deployed live in the member account — without this chain every `aws`
      # call from the playbooks targets management and fails with
      # ResourceNotFoundException. Terraform does the equivalent via the
      # provider's assume_role block.
      - name: Assume the target account deploy role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ env.TARGET_ACCOUNT_ID }}:role/TerraformDeployRole
          aws-region: ${{ env.AWS_REGION }}
          role-chaining: true
          # The action tags the session by default, which needs sts:TagSession.
          # The member-account role's trust policy allows AssumeRole only (as
          # does Terraform's assume_role, which is why apply works), so skip it.
          role-skip-session-tagging: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ansible
        run: pip install ansible

      # Node + pnpm are needed by deploy_lambda.yml, which builds the app's
      # esbuild bundles from the checked-out simmerplan-app before pushing them.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      # No pnpm cache here: the app is checked out into a subdirectory and this
      # repo has no root package.json, so setup-node cannot resolve the pnpm
      # store path and fails with "Some specified paths were not resolved".
      # deploy_lambda runs its own `pnpm install --frozen-lockfile` regardless,
      # so the cache is only an optimisation.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Deploy Lambda functions
        working-directory: ansible
        run: >-
          ansible-playbook playbooks/deploy_lambda.yml
          -e env=${{ env.DEPLOY_ENV }}
          -e app_repo_path=${{ github.workspace }}/simmerplan-app

      - name: Deploy static assets
        working-directory: ansible
        run: >-
          ansible-playbook playbooks/deploy_static.yml
          -e env=${{ env.DEPLOY_ENV }}
          -e app_repo_path=${{ github.workspace }}/simmerplan-app

      - name: Health check
        working-directory: ansible
        run: >-
          ansible-playbook playbooks/health_check.yml
          -e env=${{ env.DEPLOY_ENV }}
