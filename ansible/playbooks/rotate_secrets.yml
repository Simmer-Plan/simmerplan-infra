---
# Rotate a Secrets Manager secret (SIM-36). Writes a new secret value stage;
# the old value remains available as AWSPREVIOUS for rollback.
#
#   ansible-playbook playbooks/rotate_secrets.yml \
#     -e env=sandbox \
#     -e secret_name=simmerplan-google-oauth-sandbox \
#     -e secret_value='{"client_id":"...","client_secret":"..."}'
#
# Required extra vars: env, secret_name, secret_value. NB: 'environment' is a
# reserved Ansible keyword — do not use it as a variable name.

- name: Rotate Secrets Manager secrets
  hosts: localhost
  gather_facts: false

  vars:
    aws_region: ca-central-1

  tasks:
    - name: Validate inputs
      ansible.builtin.assert:
        that:
          - env is defined
          - env in ['sandbox', 'prod']
          - secret_name is defined
          - secret_value is defined
        fail_msg: "Pass -e env=… -e secret_name=… -e secret_value=…"

    - name: Confirm the secret exists
      ansible.builtin.command: >-
        aws secretsmanager describe-secret
        --secret-id {{ secret_name }} --region {{ aws_region }}
        --query ARN --output text
      register: secret_arn
      changed_when: false

    - name: Put new secret value
      ansible.builtin.command: >-
        aws secretsmanager put-secret-value
        --secret-id {{ secret_name }} --region {{ aws_region }}
        --secret-string {{ secret_value | quote }}
      register: put_result
      changed_when: true
      no_log: true

    - name: Verify AWSCURRENT points at a fresh version
      ansible.builtin.command: >-
        aws secretsmanager describe-secret
        --secret-id {{ secret_name }} --region {{ aws_region }}
        --query "keys(VersionIdsToStages)[0]" --output text
      register: current_version
      changed_when: false

    - name: Rotation summary
      ansible.builtin.debug:
        msg: "Rotated {{ secret_name }} ({{ secret_arn.stdout }}). Previous value remains on the AWSPREVIOUS stage."
