---
- name: Verify node and pnpm are available
  ansible.builtin.command: "{{ item }} --version"
  changed_when: false
  loop:
    - node
    - pnpm

- name: Verify scaffold script exists
  ansible.builtin.stat:
    path: "{{ app_repo_path }}/scripts/scaffold-db.ts"
  register: scaffold_script
  failed_when: not scaffold_script.stat.exists

# simmerplan-app is a pnpm workspace; the scaffold lives in the
# @simmerplan/scripts package and is run via the root `scaffold:db` script
# (which filters to that package). `npx tsx` does not resolve tsx from the
# workspace root, so invoke through pnpm.
- name: Scaffold DynamoDB table
  ansible.builtin.command: pnpm run scaffold:db
  args:
    chdir: "{{ app_repo_path }}"
  environment:
    DYNAMODB_TABLE: "simmerplan-{{ env }}"
    AWS_REGION: "ca-central-1"
    ENVIRONMENT: "{{ env }}"
