---
- name: Verify node is available
  ansible.builtin.command: node --version
  changed_when: false

- name: Verify scaffold script exists
  ansible.builtin.stat:
    path: "{{ app_repo_path }}/scripts/scaffold-db.ts"
  register: scaffold_script
  failed_when: not scaffold_script.stat.exists

- name: Scaffold DynamoDB table
  ansible.builtin.command: npx tsx scripts/scaffold-db.ts
  args:
    chdir: "{{ app_repo_path }}"
  environment:
    DYNAMODB_TABLE: "simmerplan-{{ env }}"
    AWS_REGION: "ca-central-1"
    ENVIRONMENT: "{{ env }}"
