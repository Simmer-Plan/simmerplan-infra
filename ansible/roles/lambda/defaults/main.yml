---
# Resolves to the sibling simmerplan-app repo for local runs.
# Override via --extra-vars in CI (e.g. app_repo_path=$GITHUB_WORKSPACE/simmerplan-app).
app_repo_path: "{{ playbook_dir }}/../../../simmerplan-app"
api_package_dir: "{{ app_repo_path }}/services/api"
lambda_dist_dir: "{{ api_package_dir }}/dist"
aws_region: ca-central-1

# Functions that have a real esbuild bundle. The bundle basename matches the
# Terraform handler (e.g. handler auth-handler.handler -> auth-handler.js), and
# esbuild emits CommonJS, so each bundle deploys as <basename>.js unchanged.
#
# simmerplan-api-<env> (handler index.handler) has no app bundle and is left as
# the Terraform stub, which answers the public /health route.
lambda_functions:
  - { name: "simmerplan-authorizer-{{ env }}", bundle: "auth-authorizer.js" }
  - { name: "simmerplan-auth-{{ env }}", bundle: "auth-handler.js" }
  - { name: "simmerplan-household-{{ env }}", bundle: "household-handler.js" }
  - { name: "simmerplan-cognito-define-{{ env }}", bundle: "cognito-define-auth-challenge.js" }
  - { name: "simmerplan-cognito-create-{{ env }}", bundle: "cognito-create-auth-challenge.js" }
  - { name: "simmerplan-cognito-verify-{{ env }}", bundle: "cognito-verify-auth-challenge.js" }
